<div class="container">
  <h2 class="titre">Positions Ouvertes</h2>

  <p-table
    [value]="positions()"
    [size]="'small'"
    [stripedRows]="true"
    [rowHover]="true"
    dataKey="ticker"
    [tableStyle]="{ 'width': '100%' }">

    <ng-template #header>
      <tr>
        <th pSortableColumn="ticker">Ticker <p-sortIcon field="ticker" /></th>
        <th style="text-align: right;" pSortableColumn="quantiteActuelle">Quantité <p-sortIcon field="quantiteActuelle" /></th>
        <th style="text-align: right;" pSortableColumn="pru">PRU <p-sortIcon field="pru" /></th>
        <th style="text-align: right;" pSortableColumn="totalInvesti">Total Investi <p-sortIcon field="totalInvesti" /></th>
      </tr>
    </ng-template>

    <ng-template #body let-position>
      <tr>
        <td class="ticker-name">
          <a [routerLink]="['/analyse', position.ticker]">
            <p-tag [value]="position.ticker" severity="info" [rounded]="true" />
          </a>
        </td>
        <td class="font-mono" style="text-align: right;">
          {{ position.quantiteActuelle }}
        </td>
        <td class="font-mono" style="text-align: right;">
          {{ position.pru | currency:'EUR':'symbol':'1.2-2' }}
        </td>
        <td class="font-mono font-bold" style="text-align: right;">
          {{ position.totalInvesti | currency:'EUR':'symbol':'1.2-2' }}
        </td>
      </tr>
    </ng-template>

    <ng-template #footer>
      <tr class="grand-total-row">
        <td colspan="3" style="text-align: right; font-weight: 700;">TOTAL INVESTI</td>
        <td class="total-amount" style="text-align: right; font-weight: 700;">
          {{ totalInvesti() | currency:'EUR':'symbol':'1.2-2' }}
        </td>
      </tr>
    </ng-template>

  </p-table>
</div>
